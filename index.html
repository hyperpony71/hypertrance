<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="HYPERTRANCE - Authentic Y2K 3D beat-reactive visuals inspired by Newgrounds. Neon ribbons, white void, spinning energy & maximum 2000s hypertrance rush.">
    <meta name="keywords" content="hypertrance, y2k visuals, newgrounds, beat reactive, neon ribbons, white background visualizer">
    <title>HYPERTRANCE - Reactive Y2K Visualizer</title>
    
    <style>
        body { margin:0; overflow:hidden; background:#fff; font-family:'Courier New',monospace; color:#ff00ff; }
        canvas { display:block; }
        
        #overlay {
            position:absolute; top:0; left:0; right:0; bottom:0;
            pointer-events:none; display:flex; flex-direction:column;
            justify-content:space-between; padding:20px; box-sizing:border-box; z-index:100;
            text-shadow: 0 0 12px #ff00ff, 0 0 25px #00ffff;
        }
        .title {
            font-size:5rem; font-weight:bold; text-align:center; letter-spacing:14px;
            animation:glitch 0.7s infinite; text-transform:uppercase; color:#000;
        }
        .subtitle { font-size:1.65rem; text-align:center; letter-spacing:9px; color:#000; opacity:0.85; }
        
        #controls {
            position:absolute; top:20px; left:20px; pointer-events:all; z-index:200;
            display:flex; gap:8px; flex-wrap:wrap;
        }
        button, input {
            background:rgba(255,255,255,0.9); color:#000; border:2px solid #ff00ff;
            padding:10px 18px; font-family:inherit; cursor:pointer;
        }
        button:hover { background:#ff00ff; color:#fff; }
        button.recording { background:#ff0044; color:white; animation:pulse 1s infinite; }

        .credits {
            position:absolute; bottom:25px; right:25px; font-size:0.9rem;
            opacity:0.8; pointer-events:all; z-index:200; color:#000;
        }

        @keyframes glitch {
            0%,100% { transform:translate(0); }
            20% { transform:translate(-4px,3px); }
            40% { transform:translate(4px,-3px); }
        }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.6} }
    </style>
</head>
<body>

<div id="controls">
    <input type="file" id="audioFile" accept="audio/*">
    <button id="playBtn">▶ PLAY / PAUSE</button>
    <button id="recordBtn">RECORD MP4</button>
</div>

<div id="overlay">
    <div>
        <div class="title">HYPERTRANCE</div>
        <div class="subtitle">TRANCE MUSIC • Y2K • 2004 VIBES</div>
    </div>
</div>

<div class="credits">
    visuals by <strong>hyperpony</strong><br>
    <a href="https://youtube.com/@hyperpony71" target="_blank" style="color:#ff00ff;">youtube.com/@hyperpony71</a>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>

<script>
// ============== WHITE BACKGROUND HYPERTRANCE RIBBONS ==============
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xffffff);
scene.fog = new THREE.Fog(0xffffff, 40, 220);

const camera = new THREE.PerspectiveCamera(72, window.innerWidth / window.innerHeight, 0.1, 400);
camera.position.set(0, 15, 55);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);

// Lighting for white bg
scene.add(new THREE.AmbientLight(0xaaaaaa, 0.9));
const neonPink = new THREE.PointLight(0xff0088, 6, 300);
const neonCyan = new THREE.PointLight(0x00ffff, 6, 300);
const neonYellow = new THREE.PointLight(0xffee00, 5, 250);
scene.add(neonPink, neonCyan, neonYellow);

// Grid (subtle on white)
const grid = new THREE.GridHelper(140, 70, 0x00ffff, 0xff00ff);
grid.rotation.x = Math.PI / 2;
grid.material.opacity = 0.25;
grid.material.transparent = true;
scene.add(grid);

// ============== RIBBON-LIKE OBJECTS ==============
const ribbons = [];

function createRibbon() {
    // Helical curve for ribbon feel
    const points = [];
    for (let i = 0; i < 80; i++) {
        const t = i / 8;
        points.push(new THREE.Vector3(
            Math.sin(t) * 14,
            t * 3.5 - 35,
            Math.cos(t) * 14
        ));
    }
    const curve = new THREE.CatmullRomCurve3(points);
    
    const geometry = new THREE.TubeGeometry(curve, 120, 1.8, 8, false);
    const material = new THREE.MeshPhongMaterial({
        color: 0xffffff,
        emissive: Math.random() > 0.5 ? 0xff00aa : 0x00ddff,
        shininess: 100,
        side: THREE.DoubleSide,
        transparent: true,
        opacity: 0.95
    });
    
    const ribbon = new THREE.Mesh(geometry, material);
    ribbon.userData = { speed: 0.8 + Math.random() * 1.2 };
    scene.add(ribbon);
    return ribbon;
}

// Create multiple ribbons
for (let i = 0; i < 5; i++) {
    const ribbon = createRibbon();
    ribbon.rotation.y = (i * Math.PI * 2) / 5;
    ribbon.position.y = (i % 2 === 0) ? 8 : -12;
    ribbons.push(ribbon);
}

// Extra flat spinning ribbons
for (let i = 0; i < 3; i++) {
    const torus = new THREE.Mesh(
        new THREE.TorusGeometry(22, 1.2, 6, 120),
        new THREE.MeshPhongMaterial({
            color: 0xffffff,
            emissive: i === 0 ? 0xff00ff : 0x00ffff,
            shininess: 90,
            side: THREE.DoubleSide
        })
    );
    torus.rotation.x = Math.PI / 2 + (i * 0.4);
    torus.position.y = i * 6 - 8;
    ribbons.push(torus);
    scene.add(torus);
}

// Dense particle tunnel
const particleCount = 5200;
const positions = new Float32Array(particleCount * 3);
const colors = new Float32Array(particleCount * 3);

for(let i = 0; i < particleCount * 3; i += 3) {
    const r = 48 + Math.random() * 110;
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos(2 * Math.random() - 1);
    
    positions[i]     = r * Math.sin(phi) * Math.cos(theta);
    positions[i + 1] = r * Math.sin(phi) * Math.sin(theta);
    positions[i + 2] = r * Math.cos(phi);
    
    colors[i]   = 0.1 + Math.random() * 0.9;
    colors[i+1] = 0.2;
    colors[i+2] = 0.95;
}

const particles = new THREE.Points(
    new THREE.BufferGeometry()
        .setAttribute('position', new THREE.BufferAttribute(positions, 3))
        .setAttribute('color', new THREE.BufferAttribute(colors, 3)),
    new THREE.PointsMaterial({
        size: 2.2,
        vertexColors: true,
        transparent: true,
        opacity: 0.85,
        blending: THREE.AdditiveBlending
    })
);
scene.add(particles);

// ============== AUDIO + CONTROLS ==============
let audioContext, analyser, audioElement, frequencyData = new Uint8Array(128), bassLevel = 0;

const audioFileInput = document.getElementById('audioFile');
const playBtn = document.getElementById('playBtn');
const recordBtn = document.getElementById('recordBtn');

audioFileInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    if (audioElement) audioElement.pause();
    
    audioElement = new Audio(URL.createObjectURL(file));
    audioElement.loop = true;
    
    if (!audioContext) {
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        analyser = audioContext.createAnalyser();
        analyser.fftSize = 256;
        frequencyData = new Uint8Array(analyser.frequencyBinCount);
    }
    
    const source = audioContext.createMediaElementSource(audioElement);
    source.connect(analyser);
    analyser.connect(audioContext.destination);
    audioElement.play();
});

playBtn.addEventListener('click', () => {
    if (audioElement) audioElement.paused ? audioElement.play() : audioElement.pause();
});

// Recording
let mediaRecorder, recordedChunks = [], isRecording = false;
recordBtn.addEventListener('click', async () => {
    if (!audioElement) { alert("Upload track first!"); return; }
    
    if (!isRecording) {
        const stream = renderer.domElement.captureStream(60);
        mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm' });
        recordedChunks = [];
        mediaRecorder.ondataavailable = e => recordedChunks.push(e.data);
        mediaRecorder.onstop = () => {
            const blob = new Blob(recordedChunks, { type: 'video/webm' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'hypertrance-white-ribbons.mp4';
            a.click();
        };
        mediaRecorder.start();
        isRecording = true;
        recordBtn.textContent = "STOP RECORDING";
        recordBtn.classList.add('recording');
    } else {
        mediaRecorder.stop();
        isRecording = false;
        recordBtn.textContent = "RECORD MP4";
        recordBtn.classList.remove('recording');
    }
});

// ============== ANIMATION ==============
let time = 0;

function animate() {
    requestAnimationFrame(animate);
    time += 0.018;

    if (analyser) {
        analyser.getByteFrequencyData(frequencyData);
        let bass = 0;
        for (let i = 0; i < 16; i++) bass += frequencyData[i];
        bassLevel = Math.min(bass / (16 * 255), 1);
    }

    const pulse = 1 + bassLevel * 2.4;

    // Animate ribbons
    ribbons.forEach((ribbon, i) => {
        if (ribbon.geometry.type === "TubeGeometry") {
            ribbon.rotation.y += 0.008 * ribbon.userData.speed + bassLevel * 0.04;
            ribbon.scale.setScalar(1 + Math.sin(time * 6 + i) * 0.08);
        } else {
            ribbon.rotation.z = time * (0.4 + i * 0.2) + bassLevel * 2;
            ribbon.scale.setScalar(pulse * 0.9);
        }
    });

    // Particle rush
    const pos = particles.geometry.attributes.position.array;
    for (let i = 1; i < pos.length; i += 3) {
        pos[i] -= 4.2 + bassLevel * 11;
        if (pos[i] < -160) pos[i] = 160;
    }
    particles.geometry.attributes.position.needsUpdate = true;
    particles.rotation.y = time * 0.15;

    // Light reaction
    neonPink.intensity = 6 + bassLevel * 22;
    neonCyan.intensity = 6 + bassLevel * 19;
    neonYellow.intensity = 5 + bassLevel * 16;

    renderer.render(scene, camera);
}

animate();

// Resize + Fullscreen
window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});

document.addEventListener('click', (e) => {
    if (!['BUTTON','INPUT'].includes(e.target.tagName)) {
        if (!document.fullscreenElement) document.documentElement.requestFullscreen();
    }
});
</script>
</body>
</html>
